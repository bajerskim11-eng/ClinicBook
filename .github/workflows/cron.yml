name: Scheduled jobs

# Only needed for Docker / self-hosted deployments. If you deploy to Vercel,
# its native cron (see vercel.json) handles these jobs automatically and this
# workflow is redundant.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   APP_URL      - your deployed app's base URL, e.g. https://app.example.com
#   CRON_SECRET  - must match the CRON_SECRET env var configured on the app

on:
  schedule:
    - cron: "0 * * * *" # reminders, hourly
    - cron: "*/5 * * * *" # cleanup-holds, every 5 minutes
  workflow_dispatch: {}

jobs:
  reminders:
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders
        run: |
          curl -fsS -X GET "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  cleanup-holds:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cleanup-holds
        run: |
          curl -fsS -X GET "${{ secrets.APP_URL }}/api/cron/cleanup-holds" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
